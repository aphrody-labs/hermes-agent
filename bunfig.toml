[install]
# The workspaces resolve some dependencies they do not declare, through a hoisted node_modules.
linker = "hoisted"

# Supply-chain hold: a version is resolved only once it has been published for 14 days.
minimumReleaseAge = 1209600
minimumReleaseAgeExcludes = [
  # assistant-ui packages and a couple of specific deps update a LOT.
  # Remove these when we stabilize (or we haven't updated in 2 weeks).
  "@assistant-ui/*",
  "assistant-cloud",
  "assistant-stream",
  "@radix-ui/*",
  "radix-ui",
  "safe-content-frame",
  # react-router 8.3.0 includes fixes for vulns. Remove when 8.3.0 is > 2 weeks old.
  "react-router",
  # eslint 10.8.0 includes fixes for vulns. Remove when 10.8.0 is > 2 weeks old.
  "eslint",
  "@eslint/*",
  # tar 7.5.21 includes fixes for vulns. Remove when 7.5.21 is > 2 weeks old.
  "tar",
  # concurrently 10.0.4 includes fixes for vulns. Remove when 10.0.4 is > 2 weeks old.
  "concurrently",
  # fast-uri 3.1.4 includes fixes for vulns. Remove when 3.1.4 is > 2 weeks old.
  "fast-uri",
  # minimatch 10.2.6 includes fixes for vulns. Remove when 10.2.6 is > 2 weeks old.
  "minimatch",
  # brace-expansion 5.0.9 includes fixes for vulns. Remove when 5.0.9 is > 2 weeks old.
  "brace-expansion",
  # js-yaml 4.3.1 fixes GHSA-5p4m-2wfm-xmqj. Remove when > 2 weeks old (rel 2026-07-31).
  "js-yaml",
  # nanoid 3.3.17 fixes GHSA-2v37-7h3g-55p8. Remove when > 2 weeks old (rel 2026-08-03).
  "nanoid",
  # mermaid 11.16.1 fixes 5 GHSAs. Remove when > 2 weeks old (rel 2026-08-04).
  "mermaid",
  # dompurify 3.4.17 fixes GHSA-55q2-fjhq-7xh7 follow-ups (low). Remove when > 2 weeks old (rel 2026-10-12).
  "dompurify",
  # ink needs these.
  "lightningcss",
  "postcss",
  # source-map-js 1.2.2 fixes GHSA-68fv-2mgg-jv7q (high, event-loop DoS). Remove when > 2 weeks old (rel 2026-09-30).
  "source-map-js",
  # http-cache-semantics 4.3.0 fixes GHSA-ch52-4w7c-c8xp (high, cross-user cached data disclosure).
  # Remove when 4.3.0 is > 2 weeks old (rel 2026-10-04).
  "http-cache-semantics",
  # ip-address 10.7.4 fixes GHSA-8xj3-p8x2-m3c7-family alerts (medium). Remove when > 2 weeks old (rel 2026-10-11).
  "ip-address",
  # sanitize-html 2.18.1 fixes GHSA-c9rx-x947-fp3h (medium), introduced by 2.18.0 which fixes
  # GHSA-x3q4-9hxx-gx8m/GHSA-cv27-6wvh-8x7j/GHSA-374f-7chj-9948. Remove when 2.18.1 is > 2 weeks old (rel 2026-10-14).
  "sanitize-html",
  # vitest 4.1.12 is a patch bump (4.1.11 -> 4.1.12). Remove when 4.1.12 is > 2 weeks old (rel 2026-10-15).
  "vitest",
  "@vitest/*",
  # electron 44.9.3 backports upstream Chromium/V8 security fixes, and 44.9.1+ carries the
  # eMudhra root distrust per #142533. Remove when 44.9.3 is > 2 weeks old (rel 2026-10-21).
  "electron",
]
